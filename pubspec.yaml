name: flutter_photobooth
description: "Christmas event photobooth — Flutter port of py-photobooth."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  path: ^1.9.1
  audioplayers: ^6.7.1
  camera: ^0.12.0+1
  camera_windows: ^0.2.6+4
  camera_macos: ^0.1.1
  material_ui: ^1.11.1
  wakelock_plus: ^1.8.2
  image: ^4.13.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/templates/
    - assets/swatches/
    - assets/ui/
    - assets/sounds/

  fonts:
    - family: DynaPuff
      fonts:
        - asset: assets/fonts/DynaPuff.ttf
